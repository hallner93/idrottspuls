plugins { id 'com.android.application' }

android {
    namespace 'se.idrottspuls.app'
    compileSdk 36
    defaultConfig {
        applicationId 'se.idrottspuls.app'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.3.1'
        resValue 'string', 'app_name', 'Idrottspuls'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('IDROTTSPULS_KEYSTORE_PATH') ?: 'signing-key-missing.jks')
            storePassword System.getenv('IDROTTSPULS_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'idrottspuls'
            keyPassword System.getenv('IDROTTSPULS_KEYSTORE_PASSWORD') ?: ''
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.test'
            resValue 'string', 'app_name', 'Idrottspuls'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/idrottspulsAssets') } }
}
// Package the same verified web application inside the APK. No hosted URL is used.
tasks.register('syncWebAssets', Copy) {
    from '../../web'
    into layout.buildDirectory.dir('generated/idrottspulsAssets/www')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }
