name: Bygg Idrottspuls
run-name: Idrottspuls – bygge ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idrottspuls-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kontrollera och bygg signerad Androidapp
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Hämta projektet
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Välj Java 17 och kontrollera Androidverktyg
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME_17_X64:-}" ] || [ ! -x "$JAVA_HOME_17_X64/bin/java" ]; then
            echo "::error::Java 17 saknas i byggmiljön."
            exit 1
          fi
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            echo "::error::Android SDK 36 saknas i byggmiljön."
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      - name: Kontrollera appens regler och Excel-export
        run: node --test tests/*.test.mjs

      - name: Läs in permanent signeringsnyckel
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.IDROTTSPULS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.IDROTTSPULS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signeringsnyckel saknas. Lägg till båda Idrottspuls-hemligheterna i projektets Actions-inställningar."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/idrottspuls-release.jks"
          keyfile_digest=$(sha256sum "$RUNNER_TEMP/idrottspuls-release.jks" | cut -d ' ' -f 1)
          if [ "$keyfile_digest" != '28da6b9673b3f6a475d1f9665ac70525846ba98e0e795bfc4236db936a4fac40' ]; then
            echo "::error::GitHub använder en annan nyckelfil än Idrottspuls permanenta signeringsnyckel. Uppdatera IDROTTSPULS_KEYSTORE_BASE64 från den medföljande textfilen."
            exit 1
          fi
          echo "IDROTTSPULS_KEYSTORE_PATH=$RUNNER_TEMP/idrottspuls-release.jks" >> "$GITHUB_ENV"

      - name: Bygg signerad Idrottspuls
        working-directory: android
        env:
          IDROTTSPULS_KEYSTORE_PASSWORD: ${{ secrets.IDROTTSPULS_KEYSTORE_PASSWORD }}
        run: sh ./gradlew --no-daemon --console=plain :app:assembleRelease

      - name: Verifiera och förbered installationsfilen
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner" && test -x "$apksigner"
          "$apksigner" verify "$apk"
          mkdir -p build-result
          cp "$apk" build-result/Idrottspuls.apk
          printf '%s\n' 'Idrottspuls 1.3.4' '' 'Installationsfil: Idrottspuls.apk' 'Kräver Android 8.0 eller senare.' '' 'Spara en säkerhetskopia i appen före uppdatering.' 'Installera APK-filen ovanpå den befintliga Idrottspulsappen.' 'Samma permanenta signeringsnyckel används för framtida uppdateringar.' > build-result/LAS-MIG.txt
          (cd build-result && sha256sum Idrottspuls.apk > SHA256SUMS.txt)

      - name: Lägg installationsfilen bland byggresultaten
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Idrottspuls-Android-${{ github.run_number }}
          path: build-result/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Visa hur appen hämtas
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          ## Idrottspuls är klar att installera

          Hämta **Idrottspuls-Android** under **Artifacts** längst ner på denna körnings sida.
          Packa upp zip-filen och öppna **Idrottspuls.apk** på surfplattan.

          Om du använt den tidigare testappen: skapa först en säkerhetskopia där.
          Installera den nya appen och återställ säkerhetskopian via **Export & backup**.
          Kontrollera att dina klasser finns i den nya appen innan du avinstallerar testappen.

          Byggresultatet sparas i sju dagar. En redan installerad app fortsätter att fungera.
          TEXT
